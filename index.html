    <script>
      (function() {
        var errorDiv = document.getElementById('error-display');
        function showError(title, msg) {
          errorDiv.style.display = 'block';
          errorDiv.innerHTML = '<h2 style="color:#F97316; margin-bottom:12px;">' + title + '</h2><pre style="white-space:pre-wrap; word-break:break-word; color:#fca5a5; font-size:13px;">' + msg + '</pre>';
        }
        window.addEventListener('error', function(e) {
          showError('JavaScript Error', e.message + '\n' + (e.filename || '') + ':' + (e.lineno || 0) + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          if (reason instanceof Error) {
            showError('Unhandled Promise Rejection', reason.message + '\n' + reason.stack);
          } else {
            showError('Unhandled Promise Rejection', String(reason));
          }
        });
      })();
    </script>
